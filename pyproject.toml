[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ShieldBreaker"
version = "0.1.0"
description = "EDR anomaly detection and rule extraction from API traces"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.14.0",
    "hmmlearn>=0.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "tokenizers>=0.15.0",
    "torch>=2.0.0",
    "tqdm>=4.65.0",
    "transformers>=4.35.0",
]

[tool.setuptools.packages.find]
where = ["src"]

