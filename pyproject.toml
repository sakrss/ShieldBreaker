[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ShieldBreaker"
version = "0.2.0"
description = "Differential characterization of endpoint-security runtime behavior"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "kneed>=0.8.5,<1", "scipy>=1.10,<2"]

[project.optional-dependencies]
lm = ["datasets>=2.14,<5", "tokenizers>=0.20,<0.24", "torch>=2.2,<3", "transformers>=4.45,<5", "accelerate>=0.26,<2"]
test = ["pytest>=8,<10"]

[project.scripts]
shieldbreaker = "shieldbreaker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
